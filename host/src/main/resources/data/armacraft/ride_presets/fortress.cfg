# armacraft ride preset "fortress": RCL fortress pickup physics (Desolate/pickup/pickup-fort-0.1.cfg + rcl-fort-pickup settings_custom.cfg),
# the CYCLE_* / WALLS_LENGTH lines; no CYCLE_SPEED or CYCLE_DELAY there, so Armagetron 0.2.9.3.0's 30 and 0.1 apply.
# CYCLE_SYNC_FF / CYCLE_SYNC_FF_STEPS are netcode only and not used here.
CYCLE_ACCEL 20
CYCLE_RUBBER 5
CYCLE_RUBBER_LEGACY 0
CYCLE_RUBBER_WALL_SHRINK 1
CYCLE_RUBBER_WALL_SHRINK_OVERRIDE 0
WALLS_LENGTH 400
# dead cycles' walls vanish at once (value given by the coordinator for RCL fortress; not read from the files above)
WALLS_STAY_UP_DELAY 0
