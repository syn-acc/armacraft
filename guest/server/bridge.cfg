# armacraft bridge settings (new tConfItems added by guest/src/gBridge.cpp)
BRIDGE_ENABLED 1
BRIDGE_PORT 4535
# 0.0.0.0 inside the container only; the host side publishes it on 127.0.0.1.
BRIDGE_BIND 0.0.0.0
# state snapshots per second (upper bound; also limited by the server frame rate)
BRIDGE_RATE 30
# accept {"type":"cmd"} console lines from the host (owner access level)
BRIDGE_ALLOW_CMD 1
