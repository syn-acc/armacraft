# armacraft guest: dedicated server settings (loaded via settings_dedicated.cfg -> SINCLUDE settings_custom.cfg)
# The entrypoint passes --userconfigdir /etc/armacraft, where this file is copied (or bind-mounted).

SERVER_NAME armacraft dev
TALK_TO_MASTER 0
SERVER_PORT 4534

# ---------------------------------------------------------------------------
# bridge (see guest/src/gBridge.cpp, PROTOCOL.md)
# Inside the container we bind 0.0.0.0; run.ps1 publishes 4535 on 127.0.0.1 only.
# Outside Docker keep the default BRIDGE_BIND 127.0.0.1 (v1 has no auth token).
# ---------------------------------------------------------------------------
INCLUDE bridge.cfg

# ---------------------------------------------------------------------------
# AI players: three AI-only teams so something is always moving. Bridge players and
# real clients get their own team and displace AI teams down to TEAMS_MIN in total.
# The server uses the SP_* variants while at most one human is present, so every
# setting is given twice.
# ---------------------------------------------------------------------------
NUM_AIS 0
SP_NUM_AIS 0
AUTO_AIS 0
SP_AUTO_AIS 0
AUTO_IQ 0
SP_AUTO_IQ 0
AI_IQ 60
SP_AI_IQ 60
MIN_PLAYERS 0
SP_MIN_PLAYERS 0

TEAMS_MIN 3
SP_TEAMS_MIN 3
TEAMS_MAX 8
SP_TEAMS_MAX 8
TEAM_MIN_PLAYERS 1
SP_TEAM_MIN_PLAYERS 1
TEAM_MAX_PLAYERS 1
SP_TEAM_MAX_PLAYERS 1
TEAM_BALANCE_WITH_AIS 1
SP_TEAM_BALANCE_WITH_AIS 1

# FINISH_TYPE 3 (normal): AI-only rounds play out until one team is left instead of
# ending as soon as no human cycle is alive.
FINISH_TYPE 3
SP_FINISH_TYPE 3
GAME_TYPE 1
SP_GAME_TYPE 1

# ---------------------------------------------------------------------------
# short rounds: small arena, win zone after 40 s
# ---------------------------------------------------------------------------
SIZE_FACTOR -4
SP_SIZE_FACTOR -4
WIN_ZONE_MIN_ROUND_TIME 40
SP_WIN_ZONE_MIN_ROUND_TIME 40
WIN_ZONE_MIN_LAST_DEATH 20
SP_WIN_ZONE_MIN_LAST_DEATH 20
LIMIT_ROUNDS 10
SP_LIMIT_ROUNDS 10
